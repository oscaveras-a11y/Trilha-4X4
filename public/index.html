<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Trilha-4X4</title>

  <link rel="stylesheet" href="/style.css">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

</head>

<body>

  <header class="header">

    <div class="brand">

      <div class="logo">
        4X4
      </div>

      <div class="brand-text">
        <strong>TRILHA-4X4</strong>
        <span>Explore. Conecte. Aventure-se.</span>
      </div>

    </div>

    <button
      class="login-button"
      id="loginButton"
    >
      Entrar
    </button>

  </header>

  <main class="container">

    <section class="hero">

      <h1>
        Seu mundo 4x4 começa aqui.
      </h1>

      <p>
        Encontre trilhas, crie seus próprios percursos
        e explore novos lugares.
      </p>

    </section>

    <section class="menu-grid">

      <button
        class="menu-card map-card"
        data-page="mapa"
      >

        <div class="card-icon">
          🗺️
        </div>

        <div>
          <h2>Mapas</h2>

          <p>
            Explore o mapa e encontre sua localização.
          </p>
        </div>

      </button>

      <button
        class="menu-card"
        data-page="trilhas"
      >

        <div class="card-icon">
          🛣️
        </div>

        <div>
          <h2>Trilhas</h2>

          <p>
            Encontre trilhas e passeios 4x4.
          </p>
        </div>

      </button>

      <button
        class="menu-card"
        data-page="navegacao"
      >

        <div class="card-icon">
          🧭
        </div>

        <div>
          <h2>Navegação</h2>

          <p>
            Siga seu percurso durante a aventura.
          </p>
        </div>

      </button>

      <button
        class="menu-card"
        data-page="ia"
      >

        <div class="card-icon">
          🤖
        </div>

        <div>
          <h2>IA 4x4</h2>

          <p>
            Converse com o assistente do Trilha-4X4.
          </p>
        </div>

      </button>

      <button
        class="menu-card"
        data-page="grupos"
      >

        <div class="card-icon">
          👥
        </div>

        <div>
          <h2>Grupos</h2>

          <p>
            Faça trilhas e passeios com outras pessoas.
          </p>
        </div>

      </button>

      <button
        class="menu-card"
        data-page="seguranca"
      >

        <div class="card-icon">
          🚨
        </div>

        <div>
          <h2>Segurança</h2>

          <p>
            Recursos de segurança para suas aventuras.
          </p>
        </div>

      </button>

      <button
        class="menu-card create-card"
        data-page="criar-trilha"
      >

        <div class="card-icon">
          🏁
        </div>

        <div>
          <h2>Criar trilha</h2>

          <p>
            Grave sua rota ou desenhe uma no mapa.
          </p>
        </div>

      </button>

      <button
        class="menu-card"
        data-page="meu-4x4"
      >

        <div class="card-icon">
          🚙
        </div>

        <div>
          <h2>Meu 4x4</h2>

          <p>
            Cadastre e personalize seu veículo.
          </p>
        </div>

      </button>

    </section>

    <section
      class="location-box"
      id="locationBox"
    >

      <div class="location-icon">
        📍
      </div>

      <div class="location-text">

        <strong>
          Ative sua localização
        </strong>

        <p>
          Para utilizar mapas e navegação,
          precisamos da localização do seu dispositivo.
        </p>

      </div>

      <button
        id="locationButton"
        class="location-button"
      >
        Permitir localização
      </button>

    </section>

    <div
      id="mapa"
      style="
        display: none;
        width: 100%;
        height: 500px;
        margin-top: 20px;
        border-radius: 16px;
        overflow: hidden;
      "
    ></div>

  </main>

  <footer>

    <span>
      Trilha-4X4
    </span>

    <span>
      © 2026
    </span>

  </footer>

  <script src="/app.js"></script>

</body>

</html>
